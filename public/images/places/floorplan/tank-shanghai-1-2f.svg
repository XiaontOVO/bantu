<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">上海油罐艺术中心一号罐二层平面图</title>
  <desc id="desc">表示双层 Livehouse 上层与鼓形内置体量的关系；未公开的交通与楼面边界不作推断。</desc>
  <defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12L12 0" stroke="#bdc9c0" stroke-width="1.2"/></pattern><filter id="shadow" x="-8%" y="-8%" width="116%" height="120%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#263b35" flood-opacity=".12"/></filter></defs>
  <style>.bg{fill:#f4f5f2}.title{font:700 32px 'Microsoft YaHei',sans-serif;fill:#263c38}.sub{font:16px 'Microsoft YaHei',sans-serif;fill:#687871}.shell{fill:#e8ece7;stroke:#465a52;stroke-width:5;filter:url(#shadow)}.ring{fill:#f9faf7;stroke:#839188;stroke-width:2}.core{fill:#ead7bd;stroke:#b67842;stroke-width:4}.label{font:700 24px 'Microsoft YaHei',sans-serif;fill:#364b43;text-anchor:middle;dominant-baseline:central}.small{font:16px 'Microsoft YaHei',sans-serif;fill:#677770;text-anchor:middle}.panel{fill:#fff;stroke:#d9e0da;stroke-width:2}.pt{font:700 19px 'Microsoft YaHei',sans-serif;fill:#31473d}.copy{font:15px 'Microsoft YaHei',sans-serif;fill:#586960}.note{font:13px 'Microsoft YaHei',sans-serif;fill:#74817a}.north{font:700 15px 'Microsoft YaHei',sans-serif;fill:#43584f;text-anchor:middle}</style>
  <rect class="bg" width="1200" height="760"/><text class="title" x="48" y="54">油罐艺术中心 · 一号罐 · 2F</text><text class="sub" x="50" y="83">双层 Livehouse 上层 · 保留原罐圆形边界</text>
  <g transform="translate(755 108)"><text class="north" y="0">北</text><path d="M0 12v32m-6-15 6-17 6 17" fill="none" stroke="#43584f" stroke-width="2.5"/></g>
  <circle class="shell" cx="410" cy="392" r="247"/><circle class="ring" cx="410" cy="392" r="190"/><circle class="core" cx="410" cy="392" r="148" fill-opacity=".58"/><circle cx="410" cy="392" r="77" fill="url(#hatch)" stroke="#b67842" stroke-width="2.5" stroke-dasharray="7 7"/>
  <text class="label" x="410" y="355">Livehouse</text><text class="small" x="410" y="387">上层空间</text><text class="small" x="410" y="424">鼓形内置体量范围</text><text class="small" x="410" y="548">楼面与挑空边界待场馆图纸核实</text>
  <rect class="panel" x="832" y="132" width="328" height="474" rx="20"/><text class="pt" x="864" y="177">图面识别</text><circle cx="879" cy="220" r="11" fill="#d9edf0" stroke="#465a52" stroke-width="3"/><text class="copy" x="902" y="225">原储油罐圆形壳体</text><circle cx="879" cy="266" r="11" fill="#eaf1f3" stroke="#b67842" stroke-width="3"/><text class="copy" x="902" y="271">上层内置区</text><path d="M864 297H1128" stroke="#e2e7e1" stroke-width="2"/><text class="pt" x="864" y="339">资料边界</text><text class="copy" x="864" y="379">公开资料确认一号罐为双层</text><text class="copy" x="864" y="405">演出场所，但未给出可核实</text><text class="copy" x="864" y="431">的上层房间隔断与楼梯位置。</text><text class="note" x="864" y="548">图中不补画未核实的房间</text><text class="note" x="864" y="570">或游览通道</text>
  <text class="note" x="48" y="717">OPEN Architecture 设计资料 · 伴途本地重绘 · 轮廓比例为阅读示意，非测绘图</text>
<style id="bantu-floorplan-standard-v3">
