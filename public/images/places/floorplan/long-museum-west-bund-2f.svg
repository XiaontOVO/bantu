<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">龙美术馆西岸馆 2F 二层平面图</title>
  <desc id="desc">伴途依据大舍建筑公布的二层平面重绘。展廊围绕中庭和挑空空间展开，保留的煤斗桥连接西侧，东南侧布置江景餐厅与露台。</desc>
  <style>
    .bg{fill:#f3f2ed}.title{font:700 33px 'Microsoft YaHei',sans-serif;fill:#283d43}.sub{font:17px 'Microsoft YaHei',sans-serif;fill:#6d7b77}.shell{fill:#fff;stroke:#30454b;stroke-width:6;stroke-linejoin:round;filter:url(#shadow)}.room{stroke:#fff;stroke-width:5;stroke-linejoin:round}.gallery{fill:#e8d8c9}.gallery2{fill:#ddc6b3}.public{fill:#dce9e4}.service{fill:#e7ebe9}.terrace{fill:#e7eddf}.courtyard{fill:#dfeadd;stroke:#94a78f;stroke-width:2.5}.wall{fill:none;stroke:#78847f;stroke-width:2.5}.label{font:700 17px 'Microsoft YaHei',sans-serif;fill:#293e43;text-anchor:middle;dominant-baseline:central}.small{font:15px 'Microsoft YaHei',sans-serif;fill:#677873;text-anchor:middle}.number{font:700 14px system-ui,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}.badge{fill:#8b614d}.panel{fill:#fff;stroke:#d8dfd9;stroke-width:2}.panel-head{font:700 18px 'Microsoft YaHei',sans-serif;fill:#31464b}.panel-label{font:600 15px 'Microsoft YaHei',sans-serif;fill:#53645f}.note{font:14px 'Microsoft YaHei',sans-serif;fill:#687672}.north{font:700 14px 'Microsoft YaHei',sans-serif;fill:#42585a;text-anchor:middle}.stair{fill:#eef0ec;stroke:#82908a;stroke-width:2}.bridge{fill:#d8d1c4;stroke:#756d61;stroke-width:3}
  </style>
  <defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#263942" flood-opacity=".13"/></filter><pattern id="bridgegrid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M0 0h28v28H0zM0 14h28M14 0v28" fill="none" stroke="#a99f8f" stroke-width="1.2"/></pattern></defs>
  <rect class="bg" width="1200" height="760"/><text class="title" x="48" y="54">龙美术馆西岸馆 · 2F</text><text class="sub" x="50" y="84">伞拱展廊围绕中庭展开 · 江景餐饮与户外平台相接</text>
