<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">上海油罐艺术中心四号罐二层平面图</title>
  <desc id="desc">圆形储油罐内插入三层立方体画廊，图中呈现二层的两个主要轮廓。</desc>
  <defs><filter id="shadow" x="-8%" y="-8%" width="116%" height="120%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#263b35" flood-opacity=".12"/></filter><pattern id="gallery" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M0 14L14 0" stroke="#d0c4b0" stroke-width="1"/></pattern></defs>
  <style>.bg{fill:#f4f5f2}.title{font:700 32px 'Microsoft YaHei',sans-serif;fill:#263c38}.sub{font:16px 'Microsoft YaHei',sans-serif;fill:#687871}.shell{fill:#e8ece7;stroke:#465a52;stroke-width:5;filter:url(#shadow)}.cube{fill:url(#gallery);stroke:#a46c4b;stroke-width:4}.room{fill:#fbfaf7;stroke:#c8b9a6;stroke-width:2}.label{font:700 23px 'Microsoft YaHei',sans-serif;fill:#364b43;text-anchor:middle;dominant-baseline:central}.small{font:16px 'Microsoft YaHei',sans-serif;fill:#677770;text-anchor:middle}.panel{fill:#fff;stroke:#d9e0da;stroke-width:2}.pt{font:700 19px 'Microsoft YaHei',sans-serif;fill:#31473d}.copy{font:15px 'Microsoft YaHei',sans-serif;fill:#586960}.note{font:13px 'Microsoft YaHei',sans-serif;fill:#74817a}.north{font:700 15px 'Microsoft YaHei',sans-serif;fill:#43584f;text-anchor:middle}</style>
  <rect class="bg" width="1200" height="760"/><text class="title" x="48" y="54">油罐艺术中心 · 四号罐 · 2F</text><text class="sub" x="50" y="83">圆罐壳体中的立方体画廊 · 第二层</text>
  <g transform="translate(755 108)"><text class="north" y="0">北</text><path d="M0 12v32m-6-15 6-17 6 17" fill="none" stroke="#43584f" stroke-width="2.5"/></g>
  <circle class="shell" cx="410" cy="392" r="247"/><rect class="cube" x="236" y="218" width="348" height="348"/><rect class="room" x="265" y="247" width="290" height="290"/><text class="label" x="410" y="379">画廊空间</text><text class="small" x="410" y="411">内置方形体量 · 二层</text><text class="small" x="410" y="601">圆形罐壳与方形展厅并置</text>
  <rect class="panel" x="832" y="132" width="328" height="474" rx="20"/><text class="pt" x="864" y="177">图面识别</text><circle cx="879" cy="220" r="11" fill="#d9edf0" stroke="#465a52" stroke-width="3"/><text class="copy" x="902" y="225">原储油罐圆形壳体</text><rect x="868" y="255" width="22" height="22" fill="url(#gallery)" stroke="#a46c4b" stroke-width="2"/><text class="copy" x="902" y="272">三层立方体画廊范围</text><path d="M864 305H1128" stroke="#e2e7e1" stroke-width="2"/><text class="pt" x="864" y="347">二层平面</text><text class="copy" x="864" y="387">二层画廊位于圆罐壳体内部，</text><text class="copy" x="864" y="413">与同一方形插入体量相连。</text><text class="note" x="864" y="548">内部隔断、楼梯与挑空</text><text class="note" x="864" y="570">位置不作推断</text>
  <text class="note" x="48" y="717">OPEN Architecture 设计资料 · 伴途本地重绘 · 轮廓比例为阅读示意，非测绘图</text>
