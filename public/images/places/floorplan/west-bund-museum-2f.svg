  <path class="room gallery" d="M730 168h168v250H730Z"/>
  <path class="room food" d="M730 124h168v50H730Z"/>
  <path class="room public" d="m572 333 143-31 43 89-109 68-87-46Z"/>
  <path class="atrium" d="M610 250h82v91h-82Z"/><path fill="url(#grid)" d="M615 255h72v81h-72Z"/>
  <path class="room service" d="m700 383 43-26 48 35-47 29Z"/>
  <g><circle class="dot" cx="408" cy="314" r="16"/><text class="tag" x="408" y="314">01</text><text class="label" x="427" y="350">展厅 1</text></g>
  <g><circle class="dot" cx="678" cy="503" r="16"/><text class="tag" x="678" y="503">02</text><text class="label" x="683" y="548">展厅 2</text></g>
  <g><circle class="dot" cx="817" cy="275" r="16"/><text class="tag" x="817" y="275">03</text><text class="label" x="814" y="326">展厅 3</text></g>
  <g><circle class="dot" cx="812" cy="147" r="14"/><text class="tag" x="812" y="147">04</text><text class="small" x="814" y="190">酒吧</text></g>
  <text class="small" x="651" y="295">中部挑空 / 光庭</text>
  <g class="stair"><rect x="721" y="345" width="20" height="50" rx="2"/><path d="M724 352h14m-14 8h14m-14 8h14m-14 8h14m-14 8h14"/></g>
  <text class="note" x="52" y="718">依据 David Chipperfield Architects 上层设计平面重绘 · 展墙与房间尺寸非测绘值 · 展陈以现场为准</text>
<style id="bantu-floorplan-standard-v3">
