<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">西岸美术馆 2F 二层平面图</title>
  <desc id="desc">依据 David Chipperfield Architects 公布的一层展厅设计平面重绘。展厅1、展厅2和展厅3以旋转翼状体量围绕中央挑空，酒吧连接在东侧展厅上方。</desc>
  <defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#243940" flood-opacity=".12"/></filter><pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#9eaaa3" stroke-width="1.4" opacity=".65"/></pattern></defs>
  <style>
    .bg{fill:#f4f4ef}.title{font:700 34px 'Microsoft YaHei',sans-serif;fill:#253b43}.sub{font:18px 'Microsoft YaHei',sans-serif;fill:#6b7b78}.shell{fill:#fff;stroke:#33464b;stroke-width:7;stroke-linejoin:round;filter:url(#shadow)}.room{stroke:#fff;stroke-width:7;stroke-linejoin:round}.gallery{fill:#e7d7c8}.gallery2{fill:#dcc4b1}.public{fill:#dce9e3}.service{fill:#e8eceb}.food{fill:#f0e1c6}.atrium{fill:#edf1e8;stroke:#9aaa93;stroke-width:3}.label{font:700 22px 'Microsoft YaHei',sans-serif;fill:#263b42;text-anchor:middle;dominant-baseline:central}.small{font:16px 'Microsoft YaHei',sans-serif;fill:#677873;text-anchor:middle}.tag{font:700 15px system-ui,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}.dot{fill:#8c624d}.note{font:15px 'Microsoft YaHei',sans-serif;fill:#64726e}.north{font:700 15px system-ui,sans-serif;fill:#40575a;text-anchor:middle}.stair{fill:#eff1ec;stroke:#87938e;stroke-width:2}
  </style>
  <rect class="bg" width="1200" height="760"/><text class="title" x="52" y="58">西岸美术馆 · 2F</text><text class="sub" x="54" y="91">三组展厅围绕中央挑空展开 · 建筑师设计平面重绘</text>
  <g transform="translate(1116 58)"><text class="north" y="0">北</text><path d="M0 10v31m-7-12 7-19 7 19" fill="none" stroke="#40575a" stroke-width="2.5"/></g>
  <path class="shell" d="M251 236 760 124V168h138v250l-43 117-36 113-267-123-46-57-255-78Z"/>
  <path class="room gallery" d="M251 236 760 124v43L718 382 592 470 251 390Z"/>
