<text class="panel-title" x="901" y="448">读图说明</text>
<text class="panel-text" x="901" y="480">保留展厅、通廊与中庭关系</text><text class="panel-text" x="901" y="506">扶梯以细线踏步表示</text><text class="panel-text" x="901" y="532">未标注实时位置与推荐路线</text><text class="panel-text" x="901" y="558">展厅名称按 2025 年折页</text>
