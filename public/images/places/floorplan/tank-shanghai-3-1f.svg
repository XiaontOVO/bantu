<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">上海油罐艺术中心三号罐平面图</title>
  <desc id="desc">完整圆形罐体作为穹顶展厅，中央设有可开启采光眼。</desc>
  <defs><filter id="shadow" x="-8%" y="-8%" width="116%" height="120%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#263b35" flood-opacity=".12"/></filter><pattern id="oculus" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12L12 0" stroke="#73a9b7" stroke-width="1.4"/></pattern></defs>
  <style>.bg{fill:#f4f5f2}.title{font:700 32px 'Microsoft YaHei',sans-serif;fill:#263c38}.sub{font:16px 'Microsoft YaHei',sans-serif;fill:#687871}.shell{fill:#e8ece7;stroke:#465a52;stroke-width:5;filter:url(#shadow)}.gallery{fill:#fbfaf5;stroke:#a2aaa0;stroke-width:2}.glass{fill:url(#oculus);stroke:#548b99;stroke-width:4}.label{font:700 23px 'Microsoft YaHei',sans-serif;fill:#364b43;text-anchor:middle;dominant-baseline:central}.small{font:16px 'Microsoft YaHei',sans-serif;fill:#677770;text-anchor:middle}.panel{fill:#fff;stroke:#d9e0da;stroke-width:2}.pt{font:700 19px 'Microsoft YaHei',sans-serif;fill:#31473d}.copy{font:15px 'Microsoft YaHei',sans-serif;fill:#586960}.note{font:13px 'Microsoft YaHei',sans-serif;fill:#74817a}.north{font:700 15px 'Microsoft YaHei',sans-serif;fill:#43584f;text-anchor:middle}</style>
  <rect class="bg" width="1200" height="760"/><text class="title" x="48" y="54">油罐艺术中心 · 三号罐 · 1F</text><text class="sub" x="50" y="83">保留原罐体的穹顶展厅 · 中央采光眼</text>
  <g transform="translate(755 108)"><text class="north" y="0">北</text><path d="M0 12v32m-6-15 6-17 6 17" fill="none" stroke="#43584f" stroke-width="2.5"/></g>
  <circle class="shell" cx="410" cy="392" r="247"/><circle class="gallery" cx="410" cy="392" r="203"/><circle class="glass" cx="410" cy="392" r="82"/><text class="label" x="410" y="268">穹顶展厅</text><text class="small" x="410" y="300">完整罐体内的展览空间</text><text class="label" x="410" y="382">Oculus</text><text class="small" x="410" y="414">中央采光眼</text><text class="small" x="410" y="548">天窗可开启 · 展品布局随展览变化</text>
  <rect class="panel" x="832" y="132" width="328" height="474" rx="20"/><text class="pt" x="864" y="177">图面识别</text><circle cx="879" cy="220" r="11" fill="#d9edf0" stroke="#465a52" stroke-width="3"/><text class="copy" x="902" y="225">保留的罐体轮廓</text><circle cx="879" cy="266" r="11" fill="#809bc5" stroke="#a2aaa0" stroke-width="2"/><text class="copy" x="902" y="271">罐体展厅主体</text><circle cx="879" cy="312" r="11" fill="url(#oculus)" stroke="#548b99" stroke-width="2"/><text class="copy" x="902" y="317">中央可开启采光眼</text><path d="M864 343H1128" stroke="#e2e7e1" stroke-width="2"/><text class="pt" x="864" y="385">空间特征</text><text class="copy" x="864" y="425">三号罐几乎保持原状，作为</text><text class="copy" x="864" y="451">大型艺术品与装置的穹顶空间。</text><text class="note" x="864" y="548">入口、消防设施与展品</text><text class="note" x="864" y="570">位置未在图中推断</text>
  <text class="note" x="48" y="717">OPEN Architecture 设计资料 · 伴途本地重绘 · 轮廓比例为阅读示意，非测绘图</text>
<style id="bantu-floorplan-standard-v3">
