<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1188.1" viewBox="0 0 1200 1188.1" role="img" aria-labelledby="title desc">
 <title id="title">上海公安博物馆 4F 平面示意图</title><desc id="desc">依据公开 VR 导览房间坐标重绘楼层轮廓、展区与交通空间。静态平面图不表示用户实时位置，开放布局以现场为准。</desc>
 <style>.title{font-size:30px;font-weight:650;fill:#223a50}.sub{font-size:15px;fill:#637c92}.note{font-size:13px;fill:#637c92}</style>
