<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1050" viewBox="0 0 2048 1050" role="img" aria-labelledby="title desc">
  <title id="title">上海图书馆淮海路馆 1F 自绘平面图</title>
  <desc id="desc">伴途按上海图书馆公开楼层导览图自绘，保留馆方楼层外轮廓、阅览空间、服务点、楼梯和安全出口的相对位置。</desc>
  <defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#283f51" flood-opacity=".13"/></filter>
    <style>
      .canvas{fill:#f5f6f5}.shell{fill:#d9edf0;stroke:#fff;stroke-width:22;stroke-linejoin:round;filter:url(#shadow)}.shell-edge{fill:none;stroke:#748aa8;stroke-width:2.8;stroke-linejoin:round}
      .room{stroke:#fff;stroke-width:7;stroke-linejoin:round}.primary{fill:#809bc5}.service{fill:#a0bfd2}.cutout{fill:#fff;stroke:#fff;stroke-width:4}
      .label{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:30px;font-weight:650;fill:#223a50;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#f7f8f8;stroke-width:4px;stroke-linejoin:round}
      .label.major{font-size:29px}.label.minor{font-size:22px}.label.vertical{writing-mode:vertical-rl;letter-spacing:2px;font-size:16px}
      .exit rect{fill:#287c57}.exit text{fill:#fff;font-family:'Microsoft YaHei',sans-serif;font-size:16px;font-weight:700;text-anchor:middle;dominant-baseline:central}.exit path{fill:none;stroke:#287c57;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
      .amenity rect{fill:#fff;stroke:#6683a7;stroke-width:2}.amenity text{font:700 13px sans-serif;fill:#294761;text-anchor:middle;dominant-baseline:central}
      .stair-icon path{fill:none;stroke:#47667d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .floor{font-family:system-ui,sans-serif;font-size:116px;font-weight:800;fill:#637fa5;text-anchor:middle}
    </style>
