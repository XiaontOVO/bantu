  <g><rect class="core" x="518" y="178" width="74" height="38" rx="10"/><text class="small" x="555" y="202">楼梯 · 电梯</text><rect class="core" x="642" y="576" width="84" height="38" rx="10"/><text class="small" x="684" y="600">公共通廊</text></g>
  <text class="note" x="55" y="733">馆方楼层导览的展区关系本地重绘 · 房间边界与尺寸非测绘</text>
<style id="bantu-floorplan-standard-v3">
