<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">上海自然博物馆 L2 楼层平面图</title>
  <desc id="desc">伴途依据上海自然博物馆官方楼层导览重绘。起源之谜位于西北展翼，四维影院位于东侧展区，中央为穹顶与环形公共空间。</desc>
  <defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#293e4a" flood-opacity=".13"/></filter></defs>
  <style>
    .bg{fill:#f4f6f5}.shell{fill:#fff;stroke:#334750;stroke-width:8;stroke-linejoin:round;filter:url(#shadow)}.zone{stroke:#fff;stroke-width:8;stroke-linejoin:round}.gallery{fill:#c6d4e6}.deep{fill:#91aacb}.service{fill:#dce5e6}.public{fill:#e3ece9}.dome{fill:#f6f4ed;stroke:#b8c7c6;stroke-width:4}.ring{fill:none;stroke:#dce4df;stroke-width:34}.title{font:700 34px 'Microsoft YaHei',sans-serif;fill:#263e49}.sub{font:18px 'Microsoft YaHei',sans-serif;fill:#74817e}.label{font:650 22px 'Microsoft YaHei',sans-serif;fill:#263e49;text-anchor:middle;dominant-baseline:central}.small{font:16px 'Microsoft YaHei',sans-serif;fill:#536c78;text-anchor:middle}.num{font:700 15px system-ui,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}.dot{fill:#55789a}.north{font:700 16px system-ui,sans-serif;fill:#455b60;text-anchor:middle}.note{font:15px 'Microsoft YaHei',sans-serif;fill:#78837d}.core{fill:#fff;stroke:#9bafb0;stroke-width:2}
  </style>
  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="54" y="62">上海自然博物馆 · L2</text><text class="sub" x="55" y="93">起源之谜　/　穹顶与展翼空间</text>
