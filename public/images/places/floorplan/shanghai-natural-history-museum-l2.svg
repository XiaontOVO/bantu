  <ellipse class="ring" cx="641" cy="408" rx="182" ry="144"/><ellipse class="dome" cx="641" cy="408" rx="143" ry="108"/>
  <path d="M467 321C505 284 556 263 610 259" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/><path d="M462 494C499 538 551 562 603 563" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/><path d="M815 323C845 356 855 410 841 454" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/>
  <g><circle class="dot" cx="253" cy="265" r="15"/><text class="num" x="253" y="265">01</text><text class="label" x="330" y="314">起源之谜</text><text class="small" x="330" y="349">宇宙与生命起源展区</text></g>
  <g><circle class="dot" cx="897" cy="276" r="15"/><text class="num" x="897" y="276">02</text><text class="label" x="889" y="319">四维影院</text><text class="small" x="889" y="354">沉浸式科普放映</text></g>
