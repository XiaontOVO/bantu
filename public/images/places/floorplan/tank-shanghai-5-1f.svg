<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">上海油罐艺术中心五号罐首层平面图</title>
  <desc id="desc">长方形展演体量贯穿圆形罐体，并在两端伸出形成室外舞台。</desc>
  <defs><filter id="shadow" x="-8%" y="-8%" width="116%" height="120%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#263b35" flood-opacity=".12"/></filter><pattern id="stage" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 0L12 12M12 0L0 12" stroke="#c28a63" stroke-width="1" opacity=".55"/></pattern></defs>
  <style>.bg{fill:#f4f5f2}.title{font:700 32px 'Microsoft YaHei',sans-serif;fill:#263c38}.sub{font:16px 'Microsoft YaHei',sans-serif;fill:#687871}.shell{fill:#e8ece7;stroke:#465a52;stroke-width:5;filter:url(#shadow)}.box{fill:#f0dfc5;stroke:#b67842;stroke-width:4}.stage{fill:url(#stage);stroke:#b67842;stroke-width:3}.label{font:700 23px 'Microsoft YaHei',sans-serif;fill:#364b43;text-anchor:middle;dominant-baseline:central}.small{font:16px 'Microsoft YaHei',sans-serif;fill:#677770;text-anchor:middle}.panel{fill:#fff;stroke:#d9e0da;stroke-width:2}.pt{font:700 19px 'Microsoft YaHei',sans-serif;fill:#31473d}.copy{font:15px 'Microsoft YaHei',sans-serif;fill:#586960}.note{font:13px 'Microsoft YaHei',sans-serif;fill:#74817a}.north{font:700 15px 'Microsoft YaHei',sans-serif;fill:#43584f;text-anchor:middle}</style>
  <rect class="bg" width="1200" height="760"/><text class="title" x="48" y="54">油罐艺术中心 · 五号罐 · 首层</text><text class="sub" x="50" y="83">贯穿圆罐的展演体量 · 两端形成室外舞台</text>
  <g transform="translate(755 108)"><text class="north" y="0">北</text><path d="M0 12v32m-6-15 6-17 6 17" fill="none" stroke="#43584f" stroke-width="2.5"/></g>
  <circle class="shell" cx="410" cy="392" r="232"/><rect class="stage" x="92" y="333" width="96" height="118" rx="5"/><rect class="box" x="178" y="285" width="464" height="214" rx="4"/><rect class="stage" x="632" y="333" width="96" height="118" rx="5"/>
  <text class="small" x="140" y="386">城市侧舞台</text><text class="small" x="140" y="411">城市侧</text><text class="label" x="410" y="371">多功能展演空间</text><text class="small" x="410" y="404">长方形内置体量贯穿罐体</text><text class="small" x="680" y="386">另一端舞台</text><text class="small" x="680" y="411">另一端平台</text>
  <rect class="panel" x="832" y="132" width="328" height="474" rx="20"/><text class="pt" x="864" y="177">图面识别</text><circle cx="879" cy="220" r="11" fill="#d9edf0" stroke="#465a52" stroke-width="3"/><text class="copy" x="902" y="225">原储油罐圆形壳体</text><rect x="868" y="254" width="22" height="22" fill="#f0dfc5" stroke="#b67842" stroke-width="2"/><text class="copy" x="902" y="271">贯穿罐体的展演盒</text><rect x="868" y="300" width="22" height="22" fill="url(#stage)" stroke="#b67842" stroke-width="2"/><text class="copy" x="902" y="317">两端室外舞台</text><path d="M864 343H1128" stroke="#e2e7e1" stroke-width="2"/><text class="pt" x="864" y="385">空间关系</text><text class="copy" x="864" y="425">内置长方体从罐体两侧伸出，</text><text class="copy" x="864" y="451">形成一对面向室外的舞台。</text><text class="note" x="864" y="548">场地朝向与活动布置</text><text class="note" x="864" y="570">以现场为准</text>
  <text class="note" x="48" y="717">OPEN Architecture 设计资料 · 伴途本地重绘 · 轮廓比例为阅读示意，非测绘图</text>
