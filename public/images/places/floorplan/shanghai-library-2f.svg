<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1050" viewBox="0 0 2048 1050" role="img" aria-labelledby="title desc">
  <title id="title">上海图书馆淮海路馆 2F 自绘平面图</title>
  <desc id="desc">伴途按上海图书馆公开楼层导览图自绘，保留馆方楼层外轮廓、阅览空间、服务点、楼梯和安全出口的相对位置。</desc>
  <defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#283f51" flood-opacity=".13"/></filter>
