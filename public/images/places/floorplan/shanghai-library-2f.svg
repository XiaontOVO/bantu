      .exit rect{fill:#287c57}.exit text{fill:#fff;font-family:'Microsoft YaHei',sans-serif;font-size:16px;font-weight:700;text-anchor:middle;dominant-baseline:central}.exit path{fill:none;stroke:#287c57;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
