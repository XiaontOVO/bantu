      .stair-icon path{fill:none;stroke:#47667d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .floor{font-family:system-ui,sans-serif;font-size:116px;font-weight:800;fill:#637fa5;text-anchor:middle}
    </style>
