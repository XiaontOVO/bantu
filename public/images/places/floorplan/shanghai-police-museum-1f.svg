<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="876.2" viewBox="0 0 1200 876.2" role="img" aria-labelledby="title desc">
 <title id="title">上海公安博物馆 1F 平面示意图</title><desc id="desc">依据公开 VR 导览房间坐标重绘楼层轮廓、展区与交通空间。静态平面图不表示用户实时位置，开放布局以现场为准。</desc>
 <style>.title{font-size:30px;font-weight:650;fill:#223a50}.sub{font-size:15px;fill:#637c92}.note{font-size:13px;fill:#637c92}</style>
 <rect class="canvas" width="1200" height="876.2"/>
 <text class="title" x="58" y="59">上海公安博物馆</text><text class="sub" x="60" y="89">依据公开 VR 导览轮廓重绘 · 展区与公共通行空间</text>
 <g aria-label="1F"><rect class="floor-badge" x="1066" y="35" width="86" height="44" rx="12"/><text class="floor-text" x="1109" y="58" text-anchor="middle" dominant-baseline="central" style="font-size:25px">1F</text></g>
 <g transform="translate(102 114)"><defs>
    <style>
      .paper{fill:#f5f6f5}.zone{stroke:#f5f6f5;stroke-width:9;stroke-linejoin:round}
      .exhibit{fill:#809bc5}.passage{fill:#d9edf0}.stair{fill:#a0bfd2}.exit{fill:#287c57}.wc{fill:#e8f0f2}
      .open-hall{fill:#e5eef1}.hall-tiles{fill:url(#hall-tiles);opacity:.48}.entrance-gap{fill:none;stroke:#e5eef1;stroke-width:13;stroke-linecap:butt}.entry-threshold{fill:none;stroke:#70879a;stroke-width:2.4;stroke-linecap:round}
      .wall{fill:none;stroke:#748aa8;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
      .label{fill:#223a50;text-anchor:middle;dominant-baseline:central;font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;paint-order:stroke;stroke:#f5f6f5;stroke-width:3px;stroke-linejoin:round}.label.passage{fill:#47667d}.label.exit{fill:#fff;stroke:none}
      .entry-marker rect{fill:#287c57}.entry-marker text{fill:#fff;font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:21px;font-weight:700;text-anchor:middle;dominant-baseline:central}.entry-marker path{fill:none;stroke:#287c57;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .floor-badge{fill:#23383d}.floor-text{fill:#fff;font-family:system-ui,sans-serif;font-size:14px;font-weight:700;letter-spacing:.08em}
      .scale-note{fill:#738185;font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:12px}
    </style>
    <pattern id="hall-tiles" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#bfd0d7" stroke-width="1"/></pattern>
    <clipPath id="main-hall-clip"><path d="M48.0 102.4 L190.4 102.4 L190.4 48.0 L797.4 48.0 L797.4 95.2 L948.0 95.2 L948.0 449.9 L499.8 449.9 L499.8 613.2 L427.2 613.2 L427.2 554.3 L48.0 554.3 Z"/></clipPath>
  </defs>
  
  <g aria-label="根据公开导览房间坐标绘制的平面轮廓">
    <path class="zone open-hall" d="M48.0 102.4 L190.4 102.4 L190.4 48.0 L797.4 48.0 L797.4 95.2 L948.0 95.2 L948.0 449.9 L499.8 449.9 L499.8 613.2 L427.2 613.2 L427.2 554.3 L48.0 554.3 Z"/>
    <rect class="hall-tiles" x="0" y="0" width="996" height="661" clip-path="url(#main-hall-clip)"/>
    <path class="wall" d="M48.0 102.4 L190.4 102.4 L190.4 48.0 L797.4 48.0 L797.4 95.2 L948.0 95.2 L948.0 449.9 L499.8 449.9 L499.8 613.2 L427.2 613.2 L427.2 554.3 L48.0 554.3 Z"/>
    <path class="entrance-gap" d="M385 48H457"/>
    <path class="entry-threshold" d="M385 51H457 M385 51V60 M457 51V60"/>
    <text class="label exhibit" x="311.2" y="309.3" font-size="27" font-weight="650" fill="#34474a">大厅</text>
  </g>
  <g class="entry-marker" transform="translate(420.9 0)">
    <rect x="-65" y="5" width="130" height="34" rx="17"/><text x="0" y="27">主入口</text>
    <path d="M0 40V43.0"/><path d="m-5 40 5 6 5-6"/>
  </g>
  
</g>
 <path d="M60 786.2H1140" stroke="#d8e0e4"/>
 <rect x="60" y="809.2" width="15" height="15" rx="3" fill="#809bc5"/><text class="note" x="86" y="821.2">展区</text>
 <rect x="165" y="809.2" width="15" height="15" rx="3" fill="#a0bfd2"/><text class="note" x="191" y="821.2">通行空间</text>
 <rect x="320" y="809.2" width="15" height="15" rx="3" fill="#287c57"/><text class="note" x="346" y="821.2">入口 / 出口</text>
 <text class="note" x="490" y="821.2">非测绘比例 · 以现场为准</text><text class="note" x="800" y="821.2">卫生间位置未核实</text>
 <style id="bantu-floorplan-standard-v3">
