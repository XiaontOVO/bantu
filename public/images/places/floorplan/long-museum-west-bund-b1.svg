<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">龙美术馆西岸馆 B1 地下一层平面图</title>
  <desc id="desc">伴途依据大舍建筑公布的 B1 平面重绘。地下层展厅、儿童空间、阅读区、仓储和设备区沿中央公共走廊及倾斜的场地边界组织。</desc>
  <defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#263942" flood-opacity=".13"/></filter><pattern id="parking" width="36" height="26" patternUnits="userSpaceOnUse"><path d="M0 0V26M36 0V26" stroke="#bac3be" stroke-width="2"/><path d="M8 3v18m18-18v18" stroke="#d7dcd7" stroke-width="1"/></pattern></defs>
  <style>
    .bg{fill:#f3f2ed}.title{font:700 33px 'Microsoft YaHei',sans-serif;fill:#283d43}.sub{font:17px 'Microsoft YaHei',sans-serif;fill:#6d7b77}.shell{fill:#fff;stroke:#30454b;stroke-width:6;stroke-linejoin:round;filter:url(#shadow)}.room{stroke:#fff;stroke-width:5;stroke-linejoin:round}.gallery{fill:#e8d8c9}.gallery2{fill:#ddc6b3}.public{fill:#dce9e4}.service{fill:#e7ebe9}.courtyard{fill:#e5eddf}.wall{fill:none;stroke:#78847f;stroke-width:2.5}.label{font:700 18px 'Microsoft YaHei',sans-serif;fill:#293e43;text-anchor:middle;dominant-baseline:central}.small{font:15px 'Microsoft YaHei',sans-serif;fill:#677873;text-anchor:middle}.small.compact{font-size:13px}.small.tight{font-size:12px}.number{font:700 14px system-ui,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}.badge{fill:#8b614d}.panel{fill:#fff;stroke:#d8dfd9;stroke-width:2}.panel-head{font:700 18px 'Microsoft YaHei',sans-serif;fill:#31464b}.panel-label{font:600 15px 'Microsoft YaHei',sans-serif;fill:#53645f}.note{font:14px 'Microsoft YaHei',sans-serif;fill:#687672}.north{font:700 14px 'Microsoft YaHei',sans-serif;fill:#42585a;text-anchor:middle}.stair{fill:#eef0ec;stroke:#82908a;stroke-width:2}
  </style>
  <rect class="bg" width="1200" height="760"/><text class="title" x="48" y="54">龙美术馆西岸馆 · B1</text><text class="sub" x="50" y="84">白盒子展厅与旧码头结构并置 · 建筑平面本地重绘</text>
