<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">上海油罐艺术中心二号罐一层平面图</title>
  <desc id="desc">环形餐饮空间围绕中心圆形庭院布置，呈现设计资料明确的主要空间关系。</desc>
  <defs><filter id="shadow" x="-8%" y="-8%" width="116%" height="120%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#263b35" flood-opacity=".12"/></filter><pattern id="courtyard" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 8H16M8 0V16" stroke="#9ba98e" stroke-width="1" opacity=".5"/></pattern></defs>
  <style>.bg{fill:#f4f5f2}.title{font:700 32px 'Microsoft YaHei',sans-serif;fill:#263c38}.sub{font:16px 'Microsoft YaHei',sans-serif;fill:#687871}.shell{fill:#e8ece7;stroke:#465a52;stroke-width:5;filter:url(#shadow)}.dining{fill:#f0dfc5;stroke:#b99a6c;stroke-width:3}.yard{fill:url(#courtyard);stroke:#86957b;stroke-width:3}.label{font:700 23px 'Microsoft YaHei',sans-serif;fill:#364b43;text-anchor:middle;dominant-baseline:central}.small{font:16px 'Microsoft YaHei',sans-serif;fill:#677770;text-anchor:middle}.panel{fill:#fff;stroke:#d9e0da;stroke-width:2}.pt{font:700 19px 'Microsoft YaHei',sans-serif;fill:#31473d}.copy{font:15px 'Microsoft YaHei',sans-serif;fill:#586960}.note{font:13px 'Microsoft YaHei',sans-serif;fill:#74817a}.north{font:700 15px 'Microsoft YaHei',sans-serif;fill:#43584f;text-anchor:middle}</style>
  <rect class="bg" width="1200" height="760"/><text class="title" x="48" y="54">油罐艺术中心 · 二号罐 · 1F</text><text class="sub" x="50" y="83">餐饮空间环绕中央圆形庭院</text>
  <g transform="translate(755 108)"><text class="north" y="0">北</text><path d="M0 12v32m-6-15 6-17 6 17" fill="none" stroke="#43584f" stroke-width="2.5"/></g>
  <circle class="shell" cx="410" cy="392" r="247"/><circle class="dining" cx="410" cy="392" r="194"/><circle class="yard" cx="410" cy="392" r="93"/><text class="label" x="410" y="371">中央庭院</text><text class="small" x="410" y="416">露天中庭</text><text class="label" x="410" y="245">餐饮空间</text><text class="small" x="410" y="550">环绕庭院的连续就餐区</text>
  <rect class="panel" x="832" y="132" width="328" height="474" rx="20"/><text class="pt" x="864" y="177">图面识别</text><circle cx="879" cy="220" r="11" fill="#d9edf0" stroke="#465a52" stroke-width="3"/><text class="copy" x="902" y="225">原储油罐圆形边界</text><circle cx="879" cy="266" r="11" fill="#b7c9dc" stroke="#b99a6c" stroke-width="3"/><text class="copy" x="902" y="271">环形经营带</text><circle cx="879" cy="312" r="11" fill="url(#courtyard)" stroke="#86957b" stroke-width="2"/><text class="copy" x="902" y="317">中心内院</text><path d="M864 343H1128" stroke="#e2e7e1" stroke-width="2"/><text class="pt" x="864" y="385">空间关系</text><text class="copy" x="864" y="425">二号罐以圆形内院组织餐饮，</text><text class="copy" x="864" y="451">就餐空间沿庭院周边展开。</text><text class="note" x="864" y="548">厨房、卫生间与服务分区</text><text class="note" x="864" y="570">位置未在图中推断</text>
  <text class="note" x="48" y="717">OPEN Architecture 设计资料 · 伴途本地重绘 · 轮廓比例为阅读示意，非测绘图</text>
<style id="bantu-floorplan-standard-v3">
