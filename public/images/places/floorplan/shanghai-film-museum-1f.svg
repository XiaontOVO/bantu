<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">上海电影博物馆 1F 楼层平面图</title>
  <desc id="desc">伴途根据 COORDINATION ASIA 公布的楼层导览重绘，展出光影之戏、荣耀瞬间、百年辉煌、灿烂金杯、国歌诞生、乌鸦与麻雀片场、影史第一、五号摄影棚和艺术影厅。</desc>
  <defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#233b45" flood-opacity=".13"/></filter></defs>
  <style>
    .bg{fill:#f5f5f1}.shell{fill:#fff;stroke:#263e48;stroke-width:8;stroke-linejoin:round;filter:url(#shadow)}.zone{stroke:#fff;stroke-width:8;stroke-linejoin:round}.warm{fill:#e8d4c7}.deep{fill:#d6b09d}.public{fill:#d9ebea}.service{fill:#e4e9e5}.void{fill:#f5f5f1;stroke:#cad6d3;stroke-width:3;stroke-dasharray:10 10}.title{font:700 34px 'Microsoft YaHei',sans-serif;fill:#253c46}.sub{font:18px 'Microsoft YaHei',sans-serif;fill:#73817e}.number{font:700 15px system-ui,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}.numdot{fill:#9b624b}.label{font:650 22px 'Microsoft YaHei',sans-serif;fill:#263c45;text-anchor:middle;dominant-baseline:central}.small{font:16px 'Microsoft YaHei',sans-serif;fill:#637570;text-anchor:middle}.route{fill:none;stroke:#4c9290;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:4 14}.door{stroke:#4c9290;stroke-width:8;stroke-linecap:round}.mark{font:700 16px 'Microsoft YaHei',sans-serif;fill:#365c5c;text-anchor:middle}.badge{fill:#fff;stroke:#b8cbc7;stroke-width:2}.north{font:700 16px system-ui,sans-serif;fill:#455b60;text-anchor:middle}.note{font:15px 'Microsoft YaHei',sans-serif;fill:#77827c}
  </style>
  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="54" y="62">上海电影博物馆 · 一层</text><text class="sub" x="55" y="93">荣誉与经典片场　/　参观路线示意</text>
  <g transform="translate(1118 56)"><text class="north" y="0">N</text><path d="M0 9v32m-7-11 7-21 7 21" fill="none" stroke="#455b60" stroke-width="2.5"/></g>
  <path class="shell" d="M145 158H1055V555L1004 605H940V647H675V601H648V676H515V603H436V632H159L137 590Z"/>
  <path class="zone deep" d="M177 190H365V314H177Z"/><path class="zone warm" d="M383 190H600V314H383Z"/><path class="zone warm" d="M618 190H1023V314H618Z"/>
  <path class="zone warm" d="M177 337H365V493H177Z"/><path class="zone warm" d="M383 337H572V493H383Z"/><path class="zone deep" d="M590 337H779V493H590Z"/><path class="zone warm" d="M797 337H1023V493H797Z"/>
  <path class="zone public" d="M449 515H661V576H449Z"/><path class="zone service" d="M680 515H924V576H680Z"/>
  <path class="door" d="M548 676h44"/><text class="mark" x="570" y="708">主入口</text>
  <g><circle class="numdot" cx="271" cy="223" r="15"/><text class="number" x="271" y="223">09</text><text class="label" x="271" y="268">艺术影厅</text></g>
  <g><circle class="numdot" cx="491" cy="223" r="15"/><text class="number" x="491" y="223">06</text><text class="label" x="491" y="260">《乌鸦与麻雀》片场</text><text class="small" x="491" y="295">电影场景复原</text></g>
  <g><circle class="numdot" cx="820" cy="223" r="15"/><text class="number" x="820" y="223">08</text><text class="label" x="820" y="260">五号摄影棚</text><text class="small" x="820" y="295">多功能影棚</text></g>
  <g><circle class="numdot" cx="271" cy="370" r="15"/><text class="number" x="271" y="370">03</text><text class="label" x="271" y="413">百年辉煌</text></g>
  <g><circle class="numdot" cx="477" cy="370" r="15"/><text class="number" x="477" y="370">07</text><text class="label" x="477" y="413">影史第一</text></g>
  <g><circle class="numdot" cx="684" cy="370" r="15"/><text class="number" x="684" y="370">04</text><text class="label" x="684" y="413">灿烂金杯</text></g>
  <g><circle class="numdot" cx="910" cy="370" r="15"/><text class="number" x="910" y="370">05</text><text class="label" x="910" y="413">国歌诞生</text></g>
  <g><circle class="numdot" cx="510" cy="535" r="15"/><text class="number" x="510" y="535">01</text><text class="label" x="570" y="558">光影之戏</text></g>
  <g><circle class="numdot" cx="724" cy="535" r="15"/><text class="number" x="724" y="535">02</text><text class="label" x="804" y="558">荣耀瞬间</text></g>
  <g><g class="restroom-marker" role="img" aria-label="卫生间" transform="translate(979 546) scale(0.9)"><rect class="restroom-backplate" x="-43" y="-15" width="86" height="30" rx="7"/><g class="restroom-pictogram" transform="translate(-30 -10)"><circle cx="-3" cy="3" r="2"/><circle cx="7" cy="3" r="2"/><path d="M-6 7h6v6h-1v6h-2v-6h-1v6h-2V7ZM7 7l4 8H9v4H7v-4H5v4H3v-4H1l4-8Z"/></g><text class="restroom-caption" x="12" y="1">卫生间</text></g><rect class="badge" x="389" y="530" width="42" height="34" rx="8"/><text class="mark" x="410" y="553">服</text></g>
  <text class="note" x="55" y="733">展区相邻关系按公开楼层图重绘 · 非测绘比例 · 展陈以现场为准</text>
<style id="bantu-floorplan-standard-v3">
svg{background:#f5f6f5}
text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif!important}
.bg,.canvas,.paper{fill:#f5f6f5!important}
.cutout{fill:#f5f6f5!important;stroke:#fff!important;stroke-width:2px!important}
linearGradient[id*="paper"] stop,linearGradient#page stop,linearGradient#background stop{stop-color:#f5f6f5!important}
linearGradient#public stop{stop-color:#a0bfd2!important}linearGradient#closed stop{stop-color:#dfe4e8!important}
#grid path{stroke:#d8e0e4!important}
.shell,.outer,.plan-shell{fill:#d9edf0!important;stroke:#748aa8!important;stroke-width:2.5px!important;stroke-linejoin:round}
.room,.room-dark,.zone,.gallery,.exhibit,.primary,.deep,.blue,.stage,.shop,.retail{fill:#809bc5!important;stroke:#fff!important;stroke-width:2.5px!important;stroke-linejoin:round}
.service,.core,.wc,.zone.wc,.amenity rect{fill:#eaf1f3!important;stroke:#748aa8!important;stroke-width:1.3px!important}
.public,.lobby,.passage,.room-light,.stair,.hall,.open-hall{fill:#a0bfd2!important;stroke:#fff!important}
.yellow,.warm,.craft,.pink,.orange,.food,.dining,.gallery2{fill:#b7c9dc!important;stroke:#fff!important}
.green,.garden,.yard,.terrace,.courtyard{fill:#d7e6dd!important;stroke:#fff!important}
.private,.void{fill:#dfe4e8!important;stroke:#a7b4bf!important}
.zone.exit,.exit,.entry,.entry-marker rect{fill:#287c57!important}
.wall,.partition,.shell-edge{stroke:#748aa8!important}
text.label,text.label2,text.label-small,text.label-light,text.minor,text.public-label,text.room-title{fill:#223a50!important;font-weight:600!important;stroke:none!important}
text.title,text.panel-title,text.panel-label,text.legend-title,text.zone-title,text.pt,text.info-heading{fill:#223a50!important;font-weight:650!important;stroke:none!important}
text.note,text.subtitle,text.sub,text.small,text.copy,text.panel-text,text.zone-sub,text.eyebrow,text.index,text.legend-text,text.info-copy{fill:#637c92!important;stroke:none!important}
.panel,.info-panel{fill:#fff!important;stroke:#d8e0e4!important;stroke-width:1.4px!important}.panel-head{fill:#eaf0f2!important}
.tag:not(text){fill:#eaf0f2!important;stroke:#748aa8!important}
.floor,.floor-badge{fill:#637fa5!important}.floor-text,.badge-text{fill:#fff!important}
.label.exit,.exit text,.entry-marker text,.entrance-text{fill:#fff!important;stroke:none!important}
.route{stroke:#d39a4e!important}.numdot,.num circle,.number circle,circle.badge{fill:#637fa5!important;stroke:#fff!important}
.door{stroke:#287c57!important}
.number text,.num text,text.number{fill:#fff!important;stroke:none!important}
.hall-tiles{opacity:.15!important}
.restroom-backplate{fill:#176c91!important;stroke:#fff!important;stroke-width:2px!important}
.restroom-pictogram circle,.restroom-pictogram path{fill:#fff!important;stroke:none!important}
.restroom-caption{font-size:13px!important;font-weight:600!important;fill:#fff!important;stroke:none!important;text-anchor:middle;dominant-baseline:central}
</style>
</svg>
