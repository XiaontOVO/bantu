<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">西岸梦中心筒仓 3F 与玻璃屋顶平面图</title>
  <desc id="desc">依据 MVRDV 公开设计平面重绘。3F 六座圆筒仓连接北侧核心，玻璃屋顶图显示圆筒组团上方的采光覆盖与中部连接区。</desc>
  <defs><filter id="shadow" x="-8%" y="-8%" width="116%" height="120%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#263b35" flood-opacity=".12"/></filter><pattern id="tank" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#d7ddd6" stroke-width="1"/></pattern><pattern id="glass" width="11" height="11" patternUnits="userSpaceOnUse"><path d="M0 0L11 11M11 0L0 11" stroke="#a6b8b0" stroke-width="1"/></pattern></defs>
  <style>
    .bg{fill:#f4f5f2}.title{font:700 32px 'Microsoft YaHei',sans-serif;fill:#263c38}.sub{font:16px 'Microsoft YaHei',sans-serif;fill:#687871}.shell{fill:#e6ebe6;stroke:#465a52;stroke-width:4;stroke-linejoin:round;filter:url(#shadow)}.tank{fill:url(#tank);stroke:#53665c;stroke-width:3}.roof{fill:url(#glass);stroke:#82958a;stroke-width:2}.room{fill:#d5dfd8;stroke:#fff;stroke-width:3}.core{fill:#d6dcd6;stroke:#718077;stroke-width:2}.wall{fill:none;stroke:#66766f;stroke-width:2}.fine{fill:none;stroke:#89968f;stroke-width:1.4}.label{font:700 18px 'Microsoft YaHei',sans-serif;fill:#364b43;text-anchor:middle;dominant-baseline:central}.small{font:14px 'Microsoft YaHei',sans-serif;fill:#677770;text-anchor:middle}.panel{fill:#fff;stroke:#d9e0da;stroke-width:2}.panel-title{font:700 18px 'Microsoft YaHei',sans-serif;fill:#31473d}.panel-text{font:14px 'Microsoft YaHei',sans-serif;fill:#586960}.note{font:12px 'Microsoft YaHei',sans-serif;fill:#74817a}.orange{fill:#e39b55;stroke:#bd7139;stroke-width:2}.north{font:700 14px 'Microsoft YaHei',sans-serif;fill:#43584f;text-anchor:middle}
  </style>
  <rect class="bg" width="1200" height="760"/><text class="title" x="48" y="52">西岸梦中心 · 筒仓 · 3F / 玻璃屋顶</text><text class="sub" x="50" y="80">圆筒上部空间与采光屋面 · 依设计方公开图并列重绘</text>
  <g transform="translate(821 94)"><text class="north" y="0">北</text><path d="M0 10v29m-6-13 6-16 6 16" fill="none" stroke="#43584f" stroke-width="2.5"/></g>
  <text class="label" x="248" y="145">3F · 筒仓层</text><text class="label" x="608" y="145">玻璃屋顶层</text>
  <path class="shell" d="M77 170H412V536H77Z"/><path class="shell" d="M444 170H779V536H444Z"/>
  <path class="room" d="M165 182H326V282H165Z"/><path class="room" d="M532 182H693V282H532Z"/>
  <g class="tank"><circle cx="127" cy="345" r="49"/><circle cx="244" cy="345" r="49"/><circle cx="361" cy="345" r="49"/><circle cx="127" cy="454" r="49"/><circle cx="244" cy="454" r="49"/><circle cx="361" cy="454" r="49"/><circle cx="494" cy="345" r="49"/><circle cx="611" cy="345" r="49"/><circle cx="728" cy="345" r="49"/><circle cx="494" cy="454" r="49"/><circle cx="611" cy="454" r="49"/><circle cx="728" cy="454" r="49"/></g>
  <rect class="core" x="212" y="214" width="68" height="91" rx="3"/><rect class="core" x="579" y="214" width="68" height="91" rx="3"/><path class="fine" d="M220 238h52m-52 8h52m-52 8h52m-52 8h52m-52 8h52m-52 8h52m-52 8h52m-52 8h52M587 238h52m-52 8h52m-52 8h52m-52 8h52m-52 8h52m-52 8h52m-52 8h52m-52 8h52"/>
  <path class="roof" d="M475 292H747V507H475Z"/><rect class="orange" x="755" y="248" width="18" height="203" rx="4"/><path class="wall" d="M455 282H779M455 520H779"/><text class="small" x="244" y="233">上部服务核心</text><text class="small" x="611" y="233">屋面采光 / 交通核心</text>
  <text class="small" x="244" y="568">六仓围绕中央交通核心</text><text class="small" x="611" y="568">玻璃覆盖六仓组团</text>
  <rect class="panel" x="866" y="126" width="292" height="468" rx="18"/><text class="panel-title" x="892" y="166">图面说明</text><text class="panel-text" x="892" y="202">左：筒仓 3F 与北侧核心</text><text class="panel-text" x="892" y="232">右：六仓上方玻璃采光面</text><text class="panel-text" x="892" y="262">东侧交通塔连至屋面平台</text><path d="M892 284H1132" stroke="#e2e7e1" stroke-width="2"/><text class="panel-title" x="892" y="324">参观提示</text><text class="panel-text" x="892" y="360">采光屋面为屋顶构造图</text><text class="panel-text" x="892" y="390">不代表可在玻璃面上行走</text><text class="note" x="892" y="544">MVRDV 公开设计平面</text><text class="note" x="892" y="567">伴途本地重绘 · 非测绘图</text>
  <text class="note" x="48" y="718">以 MVRDV 设计平面为依据重绘 · 屋面可达与开放情况以现场为准</text>
<style id="bantu-floorplan-standard-v3">
svg{background:#f5f6f5}
text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif!important}
.bg,.canvas,.paper{fill:#f5f6f5!important}
.cutout{fill:#f5f6f5!important;stroke:#fff!important;stroke-width:2px!important}
linearGradient[id*="paper"] stop,linearGradient#page stop,linearGradient#background stop{stop-color:#f5f6f5!important}
