<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">桂林公园 · 伴途原创园林场景</title>
  <desc id="desc">以本地收录的桂林公园竹林月洞门与木构游廊照片为参考，组合白墙圆门、竹影、游廊和湖石。画面不是园内方位图或可通行路径。</desc>
