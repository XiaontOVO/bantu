  <title id="title">武康大楼 · 伴途原创街角场景</title>
  <desc id="desc">从武康路与淮海中路街角的外观照片汲取轮廓，绘制红砖立面、弧形转角、石质底层与树影。画面不是测绘图，也不代表可进入的室内空间。</desc>
