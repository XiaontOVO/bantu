      <path d="M-103-27Q-55-23 0-34Q55-23 103-27M-84-9Q0-32 84-9" fill="none" stroke="#9d9d83" stroke-width="5" opacity=".65"/>
      <path d="M-65-9v53h130V-9Q0-24-65-9Z" fill="url(#wood)" stroke="#443a36" stroke-width="4"/>
      <path d="M-44-2v42M-15-7v47M15-7v47M44-2v42" stroke="#d2a469" stroke-width="6" opacity=".75"/>
      <path d="M-67 27h134M-67 42h134" stroke="#473a37" stroke-width="8"/>
    </g>
    <g id="leafCluster"><ellipse cx="-45" cy="8" rx="73" ry="47" fill="#52795d"/><ellipse cx="35" cy="-11" rx="80" ry="58" fill="#426e59"/><ellipse cx="-5" cy="-43" rx="67" ry="50" fill="#6f8d66"/><path d="M-81-1q42-23 80-11M10-51q37-13 61 3" fill="none" stroke="#b2bd82" stroke-width="8" opacity=".27"/></g>
