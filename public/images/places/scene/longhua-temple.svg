<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">龙华寺 · 伴途原创寺院场景</title>
  <desc id="desc">以已收录的龙华塔和寺院庭院照片为参考，组合层层塔檐、殿堂屋檐与铜色香炉。画面将不同视角合在一起，不表示真实方位、院落布局或参拜路线。</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#d1e6e7"/><stop offset=".54" stop-color="#f2e7c9"/><stop offset="1" stop-color="#e4b990"/></linearGradient>
    <linearGradient id="wall" x2="1" y2="1"><stop stop-color="#e4bf7f"/><stop offset="1" stop-color="#b57a4e"/></linearGradient>
    <linearGradient id="wood" x2="1" y2="0"><stop stop-color="#513d3c"/><stop offset=".52" stop-color="#8e5543"/><stop offset="1" stop-color="#3c383b"/></linearGradient>
    <linearGradient id="tile" x2="0" y2="1"><stop stop-color="#788078"/><stop offset=".54" stop-color="#4d5658"/><stop offset="1" stop-color="#333e41"/></linearGradient>
    <linearGradient id="bronze" x2="1" y2="1"><stop stop-color="#8f7760"/><stop offset=".5" stop-color="#4b4c45"/><stop offset="1" stop-color="#272f32"/></linearGradient>
    <radialGradient id="sun"><stop stop-color="#fff4d0" stop-opacity=".82"/><stop offset="1" stop-color="#fff4d0" stop-opacity="0"/></radialGradient>
    <filter id="shade" x="-.2" y="-.2" width="1.4" height="1.5"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#423b31" flood-opacity=".23"/></filter>
