<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">徐家汇公园 · 伴途原创园景</title>
  <desc id="desc">以已收录的烟囱与林荫步道照片为参考，将工业遗存、树荫步道和高架步道组成艺术化画面。不同视角被组合在一起，不表示真实相邻关系或游园路线。</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#d4edf1"/><stop offset=".6" stop-color="#f2eacb"/><stop offset="1" stop-color="#f4d7af"/></linearGradient>
    <linearGradient id="path" x2="0" y2="1"><stop stop-color="#dfd4b4"/><stop offset="1" stop-color="#f2e4c6"/></linearGradient>
    <linearGradient id="chimney" x2="1" y2="0"><stop stop-color="#643b37"/><stop offset=".26" stop-color="#a1513e"/><stop offset=".68" stop-color="#bd7450"/><stop offset="1" stop-color="#6d433b"/></linearGradient>
    <linearGradient id="leaf" x2="0" y2="1"><stop stop-color="#538b70"/><stop offset="1" stop-color="#265d59"/></linearGradient>
    <linearGradient id="farleaf" x2="0" y2="1"><stop stop-color="#9fbd81"/><stop offset="1" stop-color="#4f8068"/></linearGradient>
    <filter id="softShadow" x="-.2" y="-.2" width="1.4" height="1.5"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#2b5a57" flood-opacity=".2"/></filter>
    <pattern id="brick" width="36" height="18" patternUnits="userSpaceOnUse"><path d="M0 17.5h36M18 0v9M0 9v9M36 9v9" fill="none" stroke="#f3b68c" stroke-width="1.4" opacity=".38"/></pattern>
    <g id="broadTree">
      <path d="M0 80V-105M0-38l-63-75M0-69l57-72" fill="none" stroke="#665646" stroke-width="21" stroke-linecap="round"/>
      <ellipse cx="-49" cy="-126" rx="96" ry="62" fill="url(#leaf)"/>
      <ellipse cx="54" cy="-157" rx="106" ry="72" fill="#42775f"/>
      <ellipse cx="5" cy="-183" rx="92" ry="68" fill="#609273"/>
      <ellipse cx="-49" cy="-142" rx="76" ry="43" fill="#78a37b" opacity=".44"/>
      <path d="M-107-151q61-37 117-9M-5-197q39-22 90-8" fill="none" stroke="#b9cb8a" stroke-width="9" opacity=".25" stroke-linecap="round"/>
    </g>
    <g id="slimTree">
      <path d="M0 100V-79M0-9l-40-52M0-30l33-55" fill="none" stroke="#6d6650" stroke-width="12" stroke-linecap="round"/>
      <ellipse cx="-29" cy="-95" rx="57" ry="45" fill="url(#farleaf)"/>
      <ellipse cx="34" cy="-110" rx="54" ry="49" fill="#6b9a73"/>
      <ellipse cx="0" cy="-136" rx="53" ry="46" fill="#7ba77b"/>
    </g>
  </defs>
  <rect width="1200" height="720" fill="url(#sky)"/>
  <circle cx="780" cy="182" r="160" fill="#fff2c7" opacity=".5"/>
  <path d="M0 370Q260 286 460 346Q627 266 821 324Q1038 288 1200 338V575H0Z" fill="#aecbb0"/>
  <path d="M0 415Q192 356 375 395Q600 344 799 392Q995 337 1200 383V590H0Z" fill="#729c79"/>
  <path d="M0 482Q194 435 349 468Q535 427 689 448Q1003 397 1200 452V720H0Z" fill="#4d8469"/>
  <!-- The brick chimney is the recognizable industrial remnant in the local photo. -->
  <g transform="translate(90 0)" filter="url(#softShadow)">
    <path d="M212 462 220 160Q222 144 239 143h36q16 0 18 17l17 302Z" fill="url(#chimney)" stroke="#70443d" stroke-width="5"/>
    <path d="M212 462 220 160Q222 144 239 143h36q16 0 18 17l17 302Z" fill="url(#brick)" opacity=".8"/>
    <path d="M225 143v-34l7-9h48l7 9v34Z" fill="#536267" stroke="#344f55" stroke-width="5"/>
    <path d="M231 103V63Q255 50 281 64v39Z" fill="#607d80" stroke="#344f55" stroke-width="5"/>
    <path d="M240 62V42q14-8 28 0v20M239 83h43M225 127h62M219 186h78M217 249h84M214 315h90M211 380h95" fill="none" stroke="#d39a76" stroke-width="5" opacity=".7"/>
    <path d="M247 56v405M273 55v406" fill="none" stroke="#513b37" stroke-width="3" opacity=".55"/>
    <path d="M222 463h90v18h-90Z" fill="#544c43"/>
  </g>
  <!-- The scene combines the chimney view with a second, tree-lined path view. -->
  <path d="M0 542Q253 518 444 471Q552 450 602 441Q666 462 770 507Q944 555 1200 546V720H0Z" fill="#98b47f"/>
  <path d="M600 439Q532 472 483 513Q392 606 301 720H911Q791 583 703 501Q652 458 600 439Z" fill="url(#path)" stroke="#c3bd9b" stroke-width="8"/>
  <path d="M600 440 609 720M555 471 439 720M646 471 786 720" fill="none" stroke="#fff7dc" stroke-width="4" opacity=".72"/>
  <path d="M0 531Q248 484 449 494L299 720H0ZM754 493Q984 470 1200 538V720H908Z" fill="#3f765e"/>
  <path d="M0 565Q224 516 417 534M785 533Q995 512 1200 579" fill="none" stroke="#b7cc83" stroke-width="27" opacity=".8"/>
  <g opacity=".75"><use href="#slimTree" transform="translate(465 484) scale(.61)"/><use href="#slimTree" transform="translate(732 484) scale(.61)"/><use href="#slimTree" transform="translate(536 448) scale(.39)"/><use href="#slimTree" transform="translate(665 448) scale(.39)"/></g>
  <!-- Elevated walkway is depicted as a theme, not as a route or entrance. -->
  <g filter="url(#softShadow)">
    <path d="M793 366Q968 319 1200 351v37Q972 354 801 405Z" fill="#5d8883" stroke="#315b5a" stroke-width="6"/>
    <path d="M805 348Q970 302 1200 334M805 366Q976 328 1200 354" fill="none" stroke="#d4e4d2" stroke-width="9"/>
    <path d="M825 367v38M882 352v41M941 343v39M1005 341v40M1073 343v41M1146 349v40" fill="none" stroke="#d7e8d6" stroke-width="5"/>
    <path d="M847 400v123M1068 380v159" fill="none" stroke="#467571" stroke-width="18"/>
    <path d="M830 520h37M1050 540h37" stroke="#2f5b58" stroke-width="7"/>
  </g>
  <g><use href="#broadTree" transform="translate(91 571) scale(1.26)"/><use href="#broadTree" transform="translate(1138 548) scale(1.16)"/></g>
  <path d="M0 0q72 50 156 27 69-43 165 9 82-38 149-4 44 15 80-3v-29ZM900 0q74 62 144 28 89-37 156 18V0Z" fill="#2e675b" opacity=".82"/>
  <path d="M0 704q178-36 313-10M886 698q181-34 314 2" fill="none" stroke="#b5ce89" stroke-width="32" opacity=".7"/>
  <path d="M0 0h1200v720H0Z" fill="#fff6dc" opacity=".035"/>
</svg>
