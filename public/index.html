
<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#365de8" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <title>伴途 · 智能旅游伴侣</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/product-design.css" />
  <link rel="stylesheet" href="/smart-companion.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg class="ui-icon" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M12 3a7.5 7.5 0 0 0-7.5 7.5c0 4.9 6.1 10.1 7.1 11a.6.6 0 0 0 .8 0c1-.9 7.1-6.1 7.1-11A7.5 7.5 0 0 0 12 3Zm-2.4 5.5a1 1 0 1 0 0 2 1 1 0 0 0 0-2Zm4.8 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2ZM8.8 13a.8.8 0 0 1 1.2-1c1.1 1.5 2.9 1.5 4 0a.8.8 0 0 1 1.2 1 4 4 0 0 1-6.4 0Z"/></svg></span>
        <div><h1>伴途</h1><p>让计划跟上变化</p></div>
      </div>
      <nav class="nav" aria-label="主导航">
        <button data-nav="home" class="active"><span class="nav-icon" data-icon="home"><svg class="ui-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path class="icon-wash" d="M5 10.5 12 4l7 6.5V18a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7.5Z"/><path d="m3.5 11 7.1-6.5a2 2 0 0 1 2.8 0l7.1 6.5M5 10v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8M9.5 20v-5.5a2.5 2.5 0 0 1 5 0V20"/></svg></span>首页</button>
        <button data-nav="places"><span class="nav-icon" data-icon="pin"><svg class="ui-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path class="icon-wash" d="M12 3.5A6.5 6.5 0 0 0 5.5 10c0 4.2 6.5 10.5 6.5 10.5s6.5-6.3 6.5-10.5A6.5 6.5 0 0 0 12 3.5Z"/><path d="M12 3.5A6.5 6.5 0 0 0 5.5 10c0 4.2 6.5 10.5 6.5 10.5s6.5-6.3 6.5-10.5A6.5 6.5 0 0 0 12 3.5Z"/><circle cx="12" cy="10" r="2.2"/></svg></span>地点</button>
        <button data-nav="today"><span class="nav-icon" data-icon="calendar"><svg class="ui-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect class="icon-wash" x="4" y="5.5" width="16" height="15" rx="3"/><rect x="4" y="5.5" width="16" height="15" rx="3"/><path d="M8 3.5v4m8-4v4M4 10h16m-12 5 2.5 2.5L16 12"/></svg></span>行程</button>
        <button data-nav="agent"><span class="nav-icon" data-icon="agent"><svg class="ui-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path class="icon-wash" d="M9 4.5h6a5.5 5.5 0 0 1 5.5 5.5v2a5.5 5.5 0 0 1-5.5 5.5h-3l-4.5 3v-3.2a5.5 5.5 0 0 1-4-5.3v-2A5.5 5.5 0 0 1 9 4.5Z"/><path d="M9 4.5h6a5.5 5.5 0 0 1 5.5 5.5v2a5.5 5.5 0 0 1-5.5 5.5h-3l-4.5 3v-3.2a5.5 5.5 0 0 1-4-5.3v-2A5.5 5.5 0 0 1 9 4.5Z"/><path d="M7.5 10.2q1-1.1 2 0m5 0q1-1.1 2 0M9.5 13q2.5 2.3 5 0"/></svg></span>伴途 Agent</button>
        <button data-nav="community"><span class="nav-icon" data-icon="community"><svg class="ui-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path class="icon-wash" d="M6.5 8h8a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3H11l-4 2.5V18h-.5a3 3 0 0 1-3-3v-4a3 3 0 0 1 3-3Z"/><path d="M10 4h7.5a3 3 0 0 1 3 3v5a3 3 0 0 1-1 2.2M6.5 8h8a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3H11l-4 2.5V18h-.5a3 3 0 0 1-3-3v-4a3 3 0 0 1 3-3Z"/></svg></span>社区</button>
      </nav>
      <div class="sidebar-foot">
        <button class="trip-mini" id="sidebarTrip" type="button" data-action="navigate" data-view="today" aria-label="查看计划与进度">正在读取计划……</button>
      </div>
    </aside>

    <div class="main">
      <header class="appbar">
        <div class="appbar-title">
          <h1 id="pageTitle">伴途</h1>
          <p id="pageSubtitle" aria-hidden="true"></p>
        </div>
        <div class="appbar-actions">
          <button id="appbarClock" class="appbar-clock" data-nav="today" aria-label="当前时间与地点，点击查看行程"><span id="appbarTime">--:--</span><span class="clock-place" id="appbarPlace"></span></button>
          <button id="themeToggle" class="icon-btn" aria-label="切换夜间模式" title="夜间模式"><svg class="ui-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path class="icon-wash" d="M19.5 14.5a7.5 7.5 0 0 1-10-10A8 8 0 1 0 19.5 14.5Z"/><path d="M19.5 14.5a7.5 7.5 0 0 1-10-10A8 8 0 1 0 19.5 14.5Z"/></svg></button>
          <button id="fontToggle" class="icon-btn" aria-label="切换字体大小" title="字体大小">A</button>
          <button id="displayPreferences" class="icon-btn mobile-display-preferences" data-action="display-preferences" aria-label="显示设置" title="显示设置" aria-haspopup="dialog"><svg class="ui-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h7m5 0h4M4 17h3m5 0h8"/><circle cx="13.5" cy="7" r="2.5"/><circle cx="9.5" cy="17" r="2.5"/></svg></button>
          <button data-nav="mine" class="icon-btn avatar-btn" aria-label="我的" title="我的"><svg class="ui-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle class="icon-wash" cx="12" cy="8" r="3.5"/><circle cx="12" cy="8" r="3.5"/><path d="M5 20v-1a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v1"/></svg></button>
        </div>
      </header>
      <main class="view" id="view">
        <div class="card skeleton" style="height:220px"></div>
      </main>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="底部导航">
    <button data-nav="home" class="active"><span class="nav-icon" data-icon="home"><svg class="ui-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path class="icon-wash" d="M5 10.5 12 4l7 6.5V18a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7.5Z"/><path d="m3.5 11 7.1-6.5a2 2 0 0 1 2.8 0l7.1 6.5M5 10v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8M9.5 20v-5.5a2.5 2.5 0 0 1 5 0V20"/></svg></span>首页</button>
    <button data-nav="places"><span class="nav-icon" data-icon="pin"><svg class="ui-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path class="icon-wash" d="M12 3.5A6.5 6.5 0 0 0 5.5 10c0 4.2 6.5 10.5 6.5 10.5s6.5-6.3 6.5-10.5A6.5 6.5 0 0 0 12 3.5Z"/><path d="M12 3.5A6.5 6.5 0 0 0 5.5 10c0 4.2 6.5 10.5 6.5 10.5s6.5-6.3 6.5-10.5A6.5 6.5 0 0 0 12 3.5Z"/><circle cx="12" cy="10" r="2.2"/></svg></span>地点</button>
    <button data-nav="today"><span class="nav-icon" data-icon="calendar"><svg class="ui-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect class="icon-wash" x="4" y="5.5" width="16" height="15" rx="3"/><rect x="4" y="5.5" width="16" height="15" rx="3"/><path d="M8 3.5v4m8-4v4M4 10h16m-12 5 2.5 2.5L16 12"/></svg></span>行程</button>
    <button data-nav="agent"><span class="nav-icon" data-icon="agent"><svg class="ui-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path class="icon-wash" d="M9 4.5h6a5.5 5.5 0 0 1 5.5 5.5v2a5.5 5.5 0 0 1-5.5 5.5h-3l-4.5 3v-3.2a5.5 5.5 0 0 1-4-5.3v-2A5.5 5.5 0 0 1 9 4.5Z"/><path d="M9 4.5h6a5.5 5.5 0 0 1 5.5 5.5v2a5.5 5.5 0 0 1-5.5 5.5h-3l-4.5 3v-3.2a5.5 5.5 0 0 1-4-5.3v-2A5.5 5.5 0 0 1 9 4.5Z"/><path d="M7.5 10.2q1-1.1 2 0m5 0q1-1.1 2 0M9.5 13q2.5 2.3 5 0"/></svg></span>伴途</button>
    <button data-nav="community"><span class="nav-icon" data-icon="community"><svg class="ui-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path class="icon-wash" d="M6.5 8h8a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3H11l-4 2.5V18h-.5a3 3 0 0 1-3-3v-4a3 3 0 0 1 3-3Z"/><path d="M10 4h7.5a3 3 0 0 1 3 3v5a3 3 0 0 1-1 2.2M6.5 8h8a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3H11l-4 2.5V18h-.5a3 3 0 0 1-3-3v-4a3 3 0 0 1 3-3Z"/></svg></span>社区</button>
  </nav>

  <div id="toast" class="toast" aria-live="polite"></div>
  <div id="agentDock" class="agent-dock" aria-live="off"></div>
  <div id="smartCompanion" class="smart-companion-host" hidden></div>
  <div id="sheetBackdrop" class="sheet-backdrop" hidden><div class="sheet" id="sheet"></div></div>

  <!-- 模块未显示可用页面或错误反馈时，经典脚本提供恢复入口。 -->
  <div id="boot-recovery" hidden>
    <div class="boot-box">
      <h2>伴途暂未加载完成</h2>
      <p>加载时间较长，可以继续等待。若一直没有页面，请检查服务与网络，或重新加载。</p>
      <div class="boot-actions">
        <button class="boot-btn-primary" data-boot-action="retry">重试连接</button>
        <button class="boot-btn-soft" data-boot-action="clear-cache">清除缓存并刷新</button>
      </div>
    </div>
  </div>
  <script src="/boot-recovery.js"></script>

  <!-- 入口是 ES module：模块默认 defer，且没有全局作用域，新增代码必须显式 import。 -->
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/vendor/gcoord/gcoord.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
